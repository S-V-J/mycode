[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycode"
version = "0.1.0"
description = "An open-source, locally-hosted agentic CLI for autonomous coding."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "S-V-J", email = "stjl093@gmail.com"}
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
mycode = "mycode.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mycode"]
